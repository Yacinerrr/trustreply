[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustreply"
version = "0.0.1"
description = "Answer security questionnaires with cited evidence and honest gap detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
trustreply = "trustreply.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trustreply"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
